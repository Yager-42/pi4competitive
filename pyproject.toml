[project]
name = "pi4competitive"
version = "0.1.0"
description = "CompetitorLens — Python port of earendil-works/pi + competitive app"
readme = "docs/ROADMAP.md"
requires-python = ">=3.12"
dependencies = [
  "earendil-works-pi-ai",
  "earendil-works-pi-agent",
  "competitive_app",
]

[tool.uv.workspace]
members = ["packages/ai", "packages/agent", "competitive_app"]

[tool.uv.sources]
earendil-works-pi-ai = { workspace = true }
earendil-works-pi-agent = { workspace = true }
competitive_app = { workspace = true }

[dependency-groups]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.24",
  "httpx>=0.27",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = ["--import-mode=importlib"]
markers = [
  "live: tests that call real provider APIs",
  "slow: long-running tests",
]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py312"
