[project]
name = "earendil-works-pi-ai"
version = "0.81.2"
description = "Python isomorphic port of @earendil-works/pi-ai (earendil-works/pi packages/ai)"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.27",
  "pydantic>=2.0",
  "anyio>=4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/earendil_works"]

[tool.hatch.build]
dev-mode-dirs = ["src"]

[tool.hatch.build.targets.wheel.force-include]
"src/earendil_works/pi_ai/providers/data" = "earendil_works/pi_ai/providers/data"
