[project]
name = "earendil-works-pi-agent"
version = "0.81.2"
description = "Python isomorphic port of @earendil-works/pi-agent-core (earendil-works/pi packages/agent)"
requires-python = ">=3.12"
dependencies = [
  "earendil-works-pi-ai",
  "pydantic>=2.0",
  "anyio>=4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/earendil_works"]

[tool.hatch.build]
dev-mode-dirs = ["src"]
