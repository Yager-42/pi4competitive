[project]
name = "competitive_app"
version = "0.1.0"
description = "CompetitorLens P4 application — DDD + FastAPI over earendil_works.pi_agent"
requires-python = ">=3.12"
dependencies = [
  "earendil-works-pi-agent",
  "fastapi>=0.110",
  "uvicorn>=0.27",
  "aiosqlite>=0.19",
  "pydantic>=2.0",
  "pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/competitive_app"]

[tool.hatch.build]
dev-mode-dirs = ["src"]
